name: Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Federate GitHub Token
        uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: jonathanmorley
          identity: terraform

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10"
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: |
          tofu plan -no-color -detailed-exitcode -out=tfplan > /dev/null 2>&1 && RC=0 || RC=$?
          echo "exitcode=$RC" >> "$GITHUB_OUTPUT"
          CHANGES=$(tofu show -no-color -json tfplan 2>/dev/null | jq -r '
            .resource_changes // [] |
            map(select(.change.actions != ["create"])) |
            if length == 0 then ""
            else map(.address + " (" + (.change.actions | join(", ")) + ")") | join("\n")
            end
          ' || true)
          {
            echo "plan<<PLANEOF"
            echo "$CHANGES"
            echo "PLANEOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "No changes."; fi

      - name: Create or Update Issue on Drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.octo-sts.outputs.token }}
          script: |
            const plan = `${{ steps.plan.outputs.plan }}`
            const body = [
              '## Infrastructure Drift Detected',
              '',
              'Terraform detected configuration drift in the following repos:',
              '',
              '```',
              plan,
              '```',
              '',
              '**Triggered by:** Scheduled drift detection'
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift'
            })

            if (existing.data.length > 0) {
              const issue = existing.data[0]
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: body
              })
              console.log(`Updated existing drift issue #${issue.number}`)
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Drift detected',
                body: body,
                labels: ['drift']
              })
              console.log('Created new drift issue')
            }

      - name: No Drift
        if: steps.plan.outputs.exitcode == '0'
        run: echo "No drift detected"
