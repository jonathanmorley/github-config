name: Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Federate GitHub Token
        uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: jonathanmorley
          identity: terraform

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10"
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: |
          tofu plan -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1 && RC=0 || RC=$?
          echo "exitcode=$RC" >> "$GITHUB_OUTPUT"
          sed -n '/^OpenTofu will perform the following actions:/,/^Plan:/p' plan.txt | awk '
            /^  # .* will be imported/ { skip=1; next }
            /^  # / { skip=0 }
            !skip { print }
          ' > changes.txt || true
          if [ -s changes.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          cat changes.txt

      - name: Create or Update Issue on Drift
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.octo-sts.outputs.token }}
          script: |
            const { execSync } = require('child_process');
            const changes = execSync('cat changes.txt', { encoding: 'utf-8' });
            const body = [
              '## Infrastructure Drift Detected',
              '',
              '```',
              changes,
              '```',
              '',
              '**Last checked:** ' + new Date().toISOString()
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift'
            })

            if (existing.data.length > 0) {
              const issue = existing.data[0]
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: body
              })
              console.log(`Updated existing drift issue #${issue.number}`)
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Drift detected',
                body: body,
                labels: ['drift']
              })
              console.log('Created new drift issue')
            }

      - name: Close Drift Issue
        if: steps.plan.outputs.has_changes == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.octo-sts.outputs.token }}
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift'
            })

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Drift resolved — infrastructure now matches configuration.'
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              })
              console.log(`Closed drift issue #${issue.number}`)
            }
