name: Terraform

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-apply

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Federate GitHub Token
        uses: octo-sts/action@a48df0af0fefd5197a00306a77dd198cdf442a76 # main
        id: octo-sts
        with:
          scope: jonathanmorley
          identity: terraform

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10"

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: tofu plan -no-color -out=tfplan
        continue-on-error: true

      - name: Write Plan to Summary
        if: always() && steps.plan.outcome != 'skipped'
        run: |
          tofu show -no-color tfplan 2>/dev/null | sed -n '/^OpenTofu will perform/,$ p' > plan.txt || true
          sed -i '/^  # .* will be created,$/N;/^  # .* will be created,$/d' plan.txt || true
          sed -i '/^OpenTofu will perform the following actions:$/d' plan.txt || true
          sed -i '/^Plan: [0-9]/d' plan.txt || true
          sed -i '/^$/d' plan.txt || true
          sed -i '/^Changes to Outputs:/d' plan.txt || true
          awk '/imported$/{skip=1; next} /# .*will be/{skip=0} !skip' plan.txt > plan_filtered.txt || true
          if [ ! -s plan_filtered.txt ]; then
            echo '### Terraform Plan' >> "$GITHUB_STEP_SUMMARY"
            echo 'No changes.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Terraform Plan' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat plan_filtered.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload Plan
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: plan
    environment: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Federate GitHub Token
        uses: octo-sts/action@a48df0af0fefd5197a00306a77dd198cdf442a76 # main
        id: octo-sts
        with:
          scope: jonathanmorley
          identity: terraform

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10"
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init

      - name: Download Plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan

      - name: OpenTofu Apply
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: tofu apply -auto-approve tfplan
