name: Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10"

      - name: Terraform Init
        env:
          TF_CLOUD_TOKEN: ${{ secrets.TF_CLOUD_TOKEN }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -detailed-exitcode
        continue-on-error: true

      - name: Create or Update Issue on Drift
        if: steps.plan.outcome == 'success' && steps.plan.exitcode == 2
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.stdout }}`
            const body = `## Infrastructure Drift Detected

Terraform detected configuration drift in the following repos:

```
${plan}
```

**Triggered by:** Scheduled drift detection`

            // Check for existing open drift issues
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift'
            })

            if (existing.data.length > 0) {
              // Update existing issue with latest drift info
              const issue = existing.data[0]
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: body
              })
              console.log(`Updated existing drift issue #${issue.number}`)
            } else {
              // Create new drift issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Drift detected',
                body: body,
                labels: ['drift']
              })
              console.log('Created new drift issue')
            }

      - name: No Drift
        if: steps.plan.outcome == 'success' && steps.plan.exitcode == 0
        run: echo "No drift detected"
