name: Terraform

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform
      cancel-in-progress: false
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Federate GitHub Token
        uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: jonathanmorley
          identity: terraform

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10"

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: tofu plan -no-color -out=tfplan
        continue-on-error: true

      - name: Write Plan to Summary
        if: always() && steps.plan.outcome != 'skipped'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        run: |
          echo '### Terraform Plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$PLAN_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload Plan
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: plan
    environment: terraform-apply
    concurrency:
      group: terraform
      cancel-in-progress: false
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Federate GitHub Token
        uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: jonathanmorley
          identity: terraform

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10"
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: OpenTofu Apply
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: tofu apply -auto-approve tfplan
