name: Terraform

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Federate GitHub Token
        uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: jonathanmorley
          identity: terraform

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10"

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Import
        id: import
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: tofu plan -no-color -state=tfstate -out=tfplan
        continue-on-error: true

      - name: OpenTofu Plan
        id: plan
        if: steps.import.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: tofu plan -no-color -state=tfstate -detailed-exitcode
        continue-on-error: true

      - name: Write Plan to Summary
        if: always() && steps.plan.outcome != 'skipped'
        run: |
          if [ "${{ steps.plan.outputs.exitcode }}" = "2" ]; then
            echo '### Terraform Plan' >> "$GITHUB_STEP_SUMMARY"
            echo 'Drift detected — see workflow logs for details.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Terraform Plan' >> "$GITHUB_STEP_SUMMARY"
            echo 'No changes.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on Import Error
        if: steps.import.outcome == 'failure'
        run: exit 1

      - name: Upload Plan
        if: steps.import.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: plan
    environment: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Federate GitHub Token
        uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: jonathanmorley
          identity: terraform

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10"
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: OpenTofu Apply
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TF_VAR_github_token: ${{ steps.octo-sts.outputs.token }}
        run: tofu apply -auto-approve tfplan
